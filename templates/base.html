<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PGS Visualizer{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-dna me-2"></i>PGS Visualizer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/distribution' %}active{% endif %}" href="/distribution">
                            <i class="fas fa-chart-area me-1"></i> Distribution
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/subcohorts' %}active{% endif %}" href="/subcohorts">
                            <i class="fas fa-layer-group me-1"></i>Subcohort Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/multivariate' %}active{% endif %}" href="/multivariate">
                            <i class="fas fa-th me-1"></i> Multivariate Analysis
                        </a>
                    </li>
                </ul>
            </div>
            <div class="dropdown ms-2">
                <button class="btn btn-outline-light dropdown-toggle" type="button" id="recentRequestsDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  Recent Requests
                  <span class="badge bg-info text-dark ms-1" id="pendingRequestsCount">0</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="recentRequestsDropdown" id="recentRequestsList" style="width: 300px;">
                  <li><p class="dropdown-item text-center text-muted">No recent requests</p></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-light py-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">PGS Visualizer - A tool for exploring Polygenic Score data</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="/static/js/main.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
<script>
    // Function to update the recent requests dropdown
    function updateRecentRequestsDropdown() {
        $.ajax({
            url: '/api/list_tasks',
            type: 'GET',
            data: { limit: 5 },
            success: function(response) {
                const $dropdown = $('#recentRequestsList');
                $dropdown.empty();
                
                if (response.length === 0) {
                    $dropdown.append('<li><p class="dropdown-item text-center text-muted">No recent requests</p></li>');
                    $('#pendingRequestsCount').text('0').hide();
                    return;
                }
                
                // Count pending requests
                const pendingCount = response.filter(task => task.status === 'processing' || task.status === 'queued').length;
                if (pendingCount > 0) {
                    $('#pendingRequestsCount').text(pendingCount).show();
                } else {
                    $('#pendingRequestsCount').hide();
                }
                
                // Add each task to the dropdown
                response.forEach(task => {
                    // Get status icon
                    let statusIcon = '';
                    if (task.status === 'completed') {
                        statusIcon = '<span class="status-dot status-completed"></span>';
                    } else if (task.status === 'processing' || task.status === 'queued') {
                        statusIcon = '<span class="status-dot status-processing"></span>';
                    } else {
                        statusIcon = '<span class="status-dot status-failed"></span>';
                    }
                    
                    // Format date
                    const createdDate = new Date(task.created_at);
                    const formattedDate = createdDate.toLocaleString();
                    
                    // Create item
                    const taskName = task.name || `${task.task_type.charAt(0).toUpperCase() + task.task_type.slice(1)} - ${task.task_id.substring(0, 6)}`;
                    
                    const $item = $(`
                    <li>
                        <a class="dropdown-item" href="${getTaskPageUrl(task.task_type, task.task_id)}">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-truncate" style="max-width: 200px;">${statusIcon} ${taskName}</span>
                            <small class="text-muted">${task.status}</small>
                        </div>
                        <small class="text-muted d-block">${formattedDate}</small>
                        </a>
                    </li>
                    `);
                    
                    $dropdown.append($item);
                });
                
                // Add link to all tasks
                $dropdown.append('<li><hr class="dropdown-divider"></li>');
                $dropdown.append('<li><a class="dropdown-item text-center" href="/tasks">View All Tasks</a></li>');
            },
            error: function(error) {
                console.error('Error fetching recent tasks:', error);
            }
        });
    }

    // Add CSS for status dots
    $('head').append(`
        <style>
            .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            }
            .status-completed {
            background-color: #28a745;
            }
            .status-processing {
            background-color: #ffc107;
            }
            .status-failed {
            background-color: #dc3545;
            }
        </style>
    `);

    // Helper function to get the correct page URL for a task
    function getTaskPageUrl(taskType, taskId) {
        switch (taskType) {
            case 'heatmap':
            case 'umap':
            case 'svd':
            return `/multivariate?task_id=${taskId}`;
            case 'distribution':
            return `/distribution?task_id=${taskId}`;
            case 'subcohort_plot':
            return `/subcohorts?task_id=${taskId}`;
            default:
            return `/tasks?task_id=${taskId}`;
        }
    }

    // Update dropdown on load and every 10 seconds
    $(document).ready(function() {
        updateRecentRequestsDropdown();
        setInterval(updateRecentRequestsDropdown, 10000);
    });

</script>
